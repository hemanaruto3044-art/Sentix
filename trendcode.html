<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinax AI | Tactical Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&display=swap');

        :root {
            --neon-green: #00ff41;
            --dark-bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Fira+Code', monospace;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        .terminal-glass {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-green); }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">
    <div class="scanline"></div>

    <div id="cpu-logo" class="fixed top-6 left-6 cursor-pointer select-none z-50">
        <div class="p-2 border border-green-500 rounded bg-black">
            <span class="text-xs font-bold">SENTINAX_CPU</span>
        </div>
    </div>

    <main id="main-terminal" class="w-full max-w-5xl h-[85vh] terminal-glass rounded-lg flex flex-col p-4 relative">
        <header class="flex justify-between items-center mb-4 border-b border-green-900 pb-2">
            <div class="text-sm font-bold tracking-widest">[ SYSTEM STATUS: ACTIVE ]</div>
            <div id="clock" class="text-xs opacity-70"></div>
        </header>

        <div id="log-container" class="flex-1 overflow-y-auto space-y-1 mb-4 text-xs">
            </div>

        <div class="relative">
            <textarea id="code-input" 
                class="w-full h-32 bg-black border border-green-900 p-3 text-green-400 focus:outline-none focus:border-green-500 resize-none"
                placeholder="// PASTE PINE SCRIPT FOR RE-ENGINEERING..."></textarea>
            <button id="submit-btn" class="absolute bottom-3 right-3 bg-green-900 hover:bg-green-600 text-black px-4 py-1 font-bold transition-all">
                SNIPER SHOT
            </button>
        </div>
    </main>

    <div id="admin-panel" class="fixed inset-0 bg-black z-[100] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold underline">SENTINEL_ADMIN_PANEL</h1>
            <button onclick="toggleAdmin(false)" class="text-red-500">[ EXIT ]</button>
        </div>
        
        <div id="auth-section" class="flex flex-col items-center justify-center flex-1">
            <button id="google-login" class="border border-green-500 p-4 hover:bg-green-500 hover:text-black transition-all">
                AUTHORIZE WITH GOOGLE
            </button>
        </div>

        <div id="admin-content" class="hidden flex flex-1 gap-4 overflow-hidden">
            <div class="w-1/3 border border-green-900 overflow-y-auto" id="submissions-list">
                </div>
            <div class="w-2/3 border border-green-900 flex flex-col p-4 bg-zinc-950">
                <div class="flex justify-between mb-2">
                    <span id="viewing-id" class="text-xs opacity-50">NO_LOG_SELECTED</span>
                    <button id="copy-all-btn" class="text-xs bg-green-700 text-white px-2 py-1 hidden">COPY_ALL</button>
                </div>
                <pre id="code-preview" class="text-sm text-green-300 overflow-auto whitespace-pre-wrap"></pre>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDzpZFAcHEm5Cu2WADM7-yXxqjF26YD6O8",
            authDomain: "qqwin-340e5.firebaseapp.com",
            databaseURL: "https://qqwin-340e5-default-rtdb.firebaseio.com",
            projectId: "qqwin-340e5",
            storageBucket: "qqwin-340e5.firebasestorage.app",
            messagingSenderId: "978524346313",
            appId: "1:978524346313:web:a935f5b75e1ce84f7b7a18",
            measurementId: "G-6964Q86YP7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const ADMIN_EMAIL = "hemanaruto3044@gmail.com";

        // UI ELEMENTS
        const logContainer = document.getElementById('log-container');
        const codeInput = document.getElementById('code-input');
        const submitBtn = document.getElementById('submit-btn');
        const cpuLogo = document.getElementById('cpu-logo');
        const adminPanel = document.getElementById('admin-panel');
        const submissionsList = document.getElementById('submissions-list');
        const codePreview = document.getElementById('code-preview');
        const copyAllBtn = document.getElementById('copy-all-btn');

        // APP LOGIC
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            // FIX: Unique ID using precise timestamp + random sequence
            const uniqueId = `${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            div.id = `log-${uniqueId}`;
            const color = type === 'error' ? 'text-red-500' : (type === 'success' ? 'text-cyan-400' : 'text-green-600');
            div.className = `${color} opacity-90`;
            div.innerHTML = `<span class="opacity-40">[${new Date().toLocaleTimeString()}]</span> > ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Handle Submission
        submitBtn.onclick = async () => {
            const code = codeInput.value.trim();
            if (!code) return addLog("ERROR: EMPTY_BUFFER_REJECTED", "error");

            addLog("UPLOADING SCRIPT TO SENTINAX_CORE...");
            try {
                await addDoc(collection(db, "submissions"), {
                    code: code,
                    timestamp: Date.now(),
                    device: navigator.userAgent
                });
                addLog("SUCCESS: ENCRYPTED_AND_ARCHIVED", "success");
                codeInput.value = "";
            } catch (e) {
                addLog(`CRITICAL_FAILURE: ${e.message}`, "error");
            }
        };

        // ADMIN PANEL TRIGGER (Triple Tap)
        let tapCount = 0;
        cpuLogo.onclick = () => {
            tapCount++;
            if (tapCount >= 3) {
                adminPanel.classList.remove('hidden');
                tapCount = 0;
            }
            setTimeout(() => tapCount = 0, 1000);
        };

        window.toggleAdmin = (show) => {
            if (!show) adminPanel.classList.add('hidden');
        };

        // GOOGLE AUTH
        document.getElementById('google-login').onclick = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                if (result.user.email === ADMIN_EMAIL) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('admin-content').classList.remove('hidden');
                    loadSubmissions();
                } else {
                    alert("ACCESS_DENIED: UNAUTHORIZED_ENTITY");
                }
            } catch (e) {
                console.error(e);
            }
        };

        // LOAD DATA (Admin Only)
        function loadSubmissions() {
            const q = query(collection(db, "submissions"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                submissionsList.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const btn = document.createElement('div');
                    btn.className = "p-3 border-b border-green-900 cursor-pointer hover:bg-green-900/20 text-[10px]";
                    btn.innerHTML = `LOG_${doc.id.substring(0,8)}<br><span class="opacity-50">${new Date(data.timestamp).toLocaleString()}</span>`;
                    btn.onclick = () => {
                        codePreview.innerText = data.code;
                        document.getElementById('viewing-id').innerText = `ID: ${doc.id}`;
                        copyAllBtn.classList.remove('hidden');
                        copyAllBtn.onclick = () => {
                            navigator.clipboard.writeText(data.code);
                            copyAllBtn.innerText = "COPIED!";
                            setTimeout(() => copyAllBtn.innerText = "COPY_ALL", 2000);
                        };
                    };
                    submissionsList.appendChild(btn);
                });
            }, (error) => {
                console.error("Firestore Permission Error:", error);
                addLog("PERMISSION_DENIED_BY_SENTINEL", "error");
            });
        }

        // Initialize UI
        setInterval(() => {
            document.getElementById('clock').innerText = `SYS_TIME: ${new Date().toISOString()}`;
        }, 1000);

        addLog("SENTINAX_OS v3.0.4 BOOTING...");
        addLog("FIREBASE_HANDSHAKE: OK");
        addLog("READY_FOR_RE_ENGINEERING");
    </script>
</body>
</html>
