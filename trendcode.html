<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinax AI | Tactical Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&display=swap');

        :root {
            --neon-green: #00ff41;
            --dark-bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Fira+Code', monospace;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        .terminal-glass {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-green); }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">
    <div class="scanline"></div>

    <div id="cpu-logo" class="fixed top-6 left-6 cursor-pointer select-none z-50">
        <div class="p-2 border border-green-500 rounded bg-black">
            <span class="text-xs font-bold">SENTINAX_CPU</span>
        </div>
    </div>

    <main id="main-terminal" class="w-full max-w-5xl h-[85vh] terminal-glass rounded-lg flex flex-col p-4 relative">
        <header class="flex justify-between items-center mb-4 border-b border-green-900 pb-2">
            <div class="text-sm font-bold tracking-widest">[ SYSTEM STATUS: ACTIVE ]</div>
            <div id="clock" class="text-xs opacity-70"></div>
        </header>

        <div id="log-container" class="flex-1 overflow-y-auto space-y-1 mb-4 text-xs">
            </div>

        <div class="relative">
            <textarea id="code-input" 
                class="w-full h-32 bg-black border border-green-900 p-3 text-green-400 focus:outline-none focus:border-green-500 resize-none"
                placeholder="// PASTE PINE SCRIPT HERE..."></textarea>
            <button id="submit-btn" class="absolute bottom-3 right-3 bg-green-900 hover:bg-green-600 text-black px-4 py-1 font-bold transition-all">
                SNIPER SHOT
            </button>
        </div>
    </main>

    <div id="admin-panel" class="fixed inset-0 bg-black z-[100] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold underline text-green-500">SENTINEL_ARCHIVE_ACCESS</h1>
            <button onclick="toggleAdmin(false)" class="text-red-500 border border-red-900 px-4 py-1 hover:bg-red-900 hover:text-white transition-all">[ CLOSE ]</button>
        </div>
        
        <div id="admin-content" class="flex flex-1 gap-4 overflow-hidden">
            <div class="w-1/3 border border-green-900 overflow-y-auto bg-zinc-900/50" id="submissions-list">
                <div class="p-4 text-xs opacity-50 italic">SCANNING FOR ARCHIVES...</div>
            </div>
            
            <div class="w-2/3 border border-green-900 flex flex-col p-4 bg-black">
                <div class="flex justify-between items-center mb-4 border-b border-green-900 pb-2">
                    <span id="viewing-id" class="text-[10px] text-green-700">SELECT_LOG_TO_PREVIEW</span>
                    <button id="copy-all-btn" class="text-xs bg-green-600 text-black px-3 py-1 font-bold hidden hover:bg-green-400">COPY_SCRIPT</button>
                </div>
                <pre id="code-preview" class="text-sm text-green-400 overflow-auto whitespace-pre-wrap font-mono"></pre>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzpZFAcHEm5Cu2WADM7-yXxqjF26YD6O8",
            authDomain: "qqwin-340e5.firebaseapp.com",
            databaseURL: "https://qqwin-340e5-default-rtdb.firebaseio.com",
            projectId: "qqwin-340e5",
            storageBucket: "qqwin-340e5.firebasestorage.app",
            messagingSenderId: "978524346313",
            appId: "1:978524346313:web:a935f5b75e1ce84f7b7a18",
            measurementId: "G-6964Q86YP7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const logContainer = document.getElementById('log-container');
        const codeInput = document.getElementById('code-input');
        const submitBtn = document.getElementById('submit-btn');
        const cpuLogo = document.getElementById('cpu-logo');
        const adminPanel = document.getElementById('admin-panel');
        const submissionsList = document.getElementById('submissions-list');
        const codePreview = document.getElementById('code-preview');
        const copyAllBtn = document.getElementById('copy-all-btn');

        // Helper: Add log to terminal
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            const uniqueId = `${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            div.id = `log-${uniqueId}`;
            const color = type === 'error' ? 'text-red-500' : (type === 'success' ? 'text-cyan-400' : 'text-green-600');
            div.className = `${color} opacity-90`;
            div.innerHTML = `<span class="opacity-40">[${new Date().toLocaleTimeString()}]</span> > ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Action: Submit Code
        submitBtn.onclick = async () => {
            const code = codeInput.value.trim();
            if (!code) return addLog("ERROR: EMPTY_BUFFER", "error");

            addLog("UPLOADING SCRIPT...");
            try {
                await addDoc(collection(db, "submissions"), {
                    code: code,
                    timestamp: Date.now()
                });
                addLog("SUCCESS: ARCHIVED_IN_FIREBASE", "success");
                codeInput.value = "";
            } catch (e) {
                addLog("CRITICAL: UPLOAD_FAILED", "error");
            }
        };

        // Action: Open Admin (Triple Tap)
        let tapCount = 0;
        cpuLogo.onclick = () => {
            tapCount++;
            if (tapCount >= 3) {
                adminPanel.classList.remove('hidden');
                loadSubmissions(); // Load data immediately on open
                tapCount = 0;
            }
            setTimeout(() => tapCount = 0, 800);
        };

        window.toggleAdmin = (show) => {
            if (!show) adminPanel.classList.add('hidden');
        };

        // Action: Load and Preview Scripts
        function loadSubmissions() {
            const q = query(collection(db, "submissions"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                submissionsList.innerHTML = "";
                if (snapshot.empty) {
                    submissionsList.innerHTML = '<div class="p-4 text-xs opacity-50">NO SCRIPTS FOUND</div>';
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const btn = document.createElement('div');
                    btn.className = "p-3 border-b border-green-900 cursor-pointer hover:bg-green-500 hover:text-black transition-all text-[10px]";
                    btn.innerHTML = `ENTRY_${doc.id.substring(0,6)}<br><span class="opacity-60">${new Date(data.timestamp).toLocaleString()}</span>`;
                    
                    btn.onclick = () => {
                        codePreview.innerText = data.code;
                        document.getElementById('viewing-id').innerText = `ID: ${doc.id}`;
                        copyAllBtn.classList.remove('hidden');
                        copyAllBtn.onclick = () => {
                            navigator.clipboard.writeText(data.code);
                            const originalText = copyAllBtn.innerText;
                            copyAllBtn.innerText = "COPIED!";
                            setTimeout(() => copyAllBtn.innerText = originalText, 1500);
                        };
                    };
                    submissionsList.appendChild(btn);
                });
            });
        }

        // Clock
        setInterval(() => {
            document.getElementById('clock').innerText = `SYS_TIME: ${new Date().toLocaleTimeString()}`;
        }, 1000);

        addLog("SYSTEM_INITIALIZED...");
        addLog("ARCHIVE_LISTENER: ACTIVE");
    </script>
</body>
</html>
