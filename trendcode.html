<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sentinax AI — Script Re-Engineering Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #020b12;
    --surface:   rgba(5, 25, 40, 0.72);
    --glass:     rgba(0, 255, 170, 0.04);
    --border:    rgba(0, 255, 170, 0.18);
    --accent:    #00ffaa;
    --accent2:   #00cfff;
    --danger:    #ff3860;
    --warn:      #ffdd57;
    --text:      #c8f0e0;
    --muted:     #4a7a6a;
    --font-mono: 'Share Tech Mono', monospace;
    --font-head: 'Orbitron', sans-serif;
    --font-body: 'Rajdhani', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  /* ─── SCANLINE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  /* ─── ANIMATED BG ─── */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,255,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 30s linear infinite;
  }
  @keyframes gridDrift {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(0,255,170,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(0,207,255,0.05) 0%, transparent 70%);
  }

  /* ─── LAYOUT ─── */
  .app-wrap {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 0 0 40px;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: rgba(2, 15, 22, 0.85);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }

  .cpu-logo {
    width: 42px; height: 42px; cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.2s;
  }
  .cpu-logo:hover { filter: drop-shadow(0 0 8px var(--accent)); }
  .cpu-logo svg { width: 100%; height: 100%; }

  .brand {
    flex: 1;
    display: flex; flex-direction: column;
  }
  .brand-name {
    font-family: var(--font-head);
    font-size: 1.15rem; font-weight: 900;
    letter-spacing: 4px; color: var(--accent);
    text-shadow: 0 0 20px rgba(0,255,170,0.4);
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--muted);
    letter-spacing: 3px;
  }

  .status-bar {
    display: flex; align-items: center; gap: 18px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .status-txt {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
    letter-spacing: 2px;
  }

  .clock {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--accent2);
    letter-spacing: 2px;
    padding: 4px 10px;
    border: 1px solid rgba(0,207,255,0.2);
    border-radius: 3px;
  }

  /* ─── MAIN CONTENT ─── */
  .main-content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    padding: 24px 28px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .main-content { grid-template-columns: 1fr; }
  }

  /* ─── GLASS PANEL ─── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    backdrop-filter: blur(20px);
    overflow: hidden;
  }

  .panel-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: rgba(0,255,170,0.05);
    border-bottom: 1px solid var(--border);
  }
  .panel-header-dots {
    display: flex; gap: 6px;
  }
  .panel-header-dots span {
    width: 9px; height: 9px; border-radius: 50%;
  }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #ffbd2e; }
  .dot-g { background: #28ca41; }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase;
    flex: 1;
  }
  .panel-badge {
    font-family: var(--font-mono);
    font-size: 0.55rem; color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 7px; border-radius: 2px;
    letter-spacing: 1px;
  }

  /* ─── TERMINAL ─── */
  .terminal-wrap { display: flex; flex-direction: column; height: 100%; }

  .syslog {
    padding: 12px 16px;
    height: 160px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    border-bottom: 1px solid var(--border);
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  .syslog::-webkit-scrollbar { width: 4px; }
  .syslog::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  .log-line { margin-bottom: 3px; display: flex; gap: 8px; }
  .log-ts { color: var(--muted); flex-shrink: 0; }
  .log-tag { flex-shrink: 0; font-weight: bold; }
  .log-tag.info  { color: var(--accent2); }
  .log-tag.ok    { color: var(--accent); }
  .log-tag.warn  { color: var(--warn); }
  .log-tag.err   { color: var(--danger); }
  .log-msg { color: var(--text); }

  .input-zone {
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    flex: 1;
  }

  label.field-label {
    font-family: var(--font-mono);
    font-size: 0.62rem; color: var(--muted);
    letter-spacing: 2px; display: block;
    margin-bottom: 6px;
  }

  textarea.code-input {
    width: 100%; min-height: 220px;
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.6;
  }
  textarea.code-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,255,170,0.1), inset 0 0 30px rgba(0,255,170,0.02);
  }
  textarea.code-input::placeholder { color: var(--muted); }

  .ai-output {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(0,207,255,0.2);
    border-radius: 4px;
    padding: 12px;
    min-height: 140px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--accent2);
    line-height: 1.7;
    white-space: pre-wrap;
    position: relative;
  }
  .ai-output .placeholder-txt {
    color: var(--muted); font-style: italic;
  }
  .ai-typing::after {
    content: '▮';
    animation: blink 0.8s step-end infinite;
    color: var(--accent2);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .btn-row {
    display: flex; gap: 10px; flex-wrap: wrap;
  }

  .btn {
    font-family: var(--font-head);
    font-size: 0.6rem; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 10px 22px;
    border: 1px solid;
    border-radius: 3px;
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.2s;
    background: transparent;
  }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn:hover::before { opacity: 0.08; }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 16px rgba(0,255,170,0.12);
  }
  .btn-primary:hover { box-shadow: 0 0 24px rgba(0,255,170,0.3); }

  .btn-secondary {
    color: var(--accent2); border-color: var(--accent2);
  }
  .btn-secondary:hover { box-shadow: 0 0 18px rgba(0,207,255,0.25); }

  .btn-danger {
    color: var(--danger); border-color: var(--danger);
  }

  .btn:disabled {
    opacity: 0.35; cursor: not-allowed;
    box-shadow: none !important;
  }

  /* ─── SIDE PANEL ─── */
  .side-panel { display: flex; flex-direction: column; gap: 16px; }

  /* ─── STATS CARD ─── */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--border);
  }
  .stat-cell {
    background: var(--surface);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-val {
    font-family: var(--font-head);
    font-size: 1.5rem; color: var(--accent);
    font-weight: 700;
    text-shadow: 0 0 20px rgba(0,255,170,0.3);
  }
  .stat-lbl {
    font-family: var(--font-mono);
    font-size: 0.55rem; color: var(--muted);
    letter-spacing: 2px;
  }

  /* ─── ACTIVITY FEED ─── */
  .activity-feed {
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
    max-height: 260px; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
  }
  .activity-feed::-webkit-scrollbar { width: 3px; }
  .activity-feed::-webkit-scrollbar-thumb { background: var(--muted); }

  .activity-item {
    display: flex; flex-direction: column; gap: 3px;
    padding: 8px 10px;
    background: rgba(0,255,170,0.03);
    border-left: 2px solid var(--accent);
    border-radius: 0 3px 3px 0;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .activity-time {
    font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--muted);
  }
  .activity-desc {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--text);
  }
  .activity-preview {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--muted);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty-feed {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
    text-align: center; padding: 20px 0;
    letter-spacing: 2px;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-outer {
    height: 3px; background: rgba(0,255,170,0.1);
    border-radius: 2px; overflow: hidden;
    margin-top: 8px; display: none;
  }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-outer.active { display: block; }

  /* ─── SPINNER ─── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,255,170,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── TOAST ─── */
  #toast-container {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9998;
  }
  .toast {
    font-family: var(--font-mono);
    font-size: 0.72rem; letter-spacing: 1px;
    padding: 10px 18px;
    border-radius: 4px;
    border-left: 3px solid;
    backdrop-filter: blur(12px);
    animation: toastIn 0.3s ease;
    max-width: 320px;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .toast.ok   { background: rgba(0,40,25,0.9); border-color: var(--accent); color: var(--accent); }
  .toast.err  { background: rgba(40,0,10,0.9); border-color: var(--danger); color: var(--danger); }
  .toast.info { background: rgba(0,20,40,0.9); border-color: var(--accent2); color: var(--accent2); }

  /* ─── ADMIN OVERLAY ─── */
  #admin-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 5000;
    background: rgba(0,5,10,0.92);
    backdrop-filter: blur(6px);
    flex-direction: column;
  }
  #admin-overlay.open { display: flex; }

  .admin-topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 28px;
    background: rgba(2,8,15,0.9);
    border-bottom: 1px solid rgba(255,56,96,0.3);
  }
  .admin-title {
    font-family: var(--font-head);
    font-size: 0.8rem; font-weight: 900;
    letter-spacing: 4px; color: var(--danger);
    text-shadow: 0 0 16px rgba(255,56,96,0.4);
    flex: 1;
  }
  .admin-user {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--muted);
  }
  .btn-close-admin {
    font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--danger); border-color: var(--danger);
    padding: 6px 14px;
  }

  /* ─── ADMIN AUTH ─── */
  #admin-auth {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid rgba(255,56,96,0.3);
    border-radius: 8px;
    padding: 40px 48px;
    text-align: center;
    display: flex; flex-direction: column; gap: 20px;
    min-width: 340px;
  }
  .auth-icon { font-size: 3rem; line-height: 1; }
  .auth-title {
    font-family: var(--font-head);
    font-size: 0.85rem; font-weight: 700;
    color: var(--danger); letter-spacing: 3px;
  }
  .auth-sub {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
  }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; cursor: pointer;
    font-family: var(--font-body); font-size: 0.85rem;
    color: #fff; font-weight: 600;
    transition: all 0.2s;
  }
  .btn-google:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
  }
  .btn-google svg { width: 20px; height: 20px; }

  /* ─── ADMIN DASHBOARD ─── */
  #admin-dashboard {
    flex: 1; display: none;
    flex-direction: column; overflow: hidden;
  }
  #admin-dashboard.active { display: flex; }

  .admin-layout {
    flex: 1; display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }
  @media (max-width: 700px) {
    .admin-layout { grid-template-columns: 1fr; }
  }

  .admin-sidebar {
    border-right: 1px solid rgba(255,56,96,0.2);
    overflow-y: auto;
    background: rgba(0,0,0,0.3);
  }
  .admin-sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,56,96,0.15);
    font-family: var(--font-mono);
    font-size: 0.58rem; color: var(--danger);
    letter-spacing: 3px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .log-count {
    background: var(--danger); color: #fff;
    font-size: 0.55rem; padding: 1px 6px;
    border-radius: 10px;
  }

  .log-item {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,56,96,0.08);
    cursor: pointer;
    transition: background 0.15s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .log-item:hover { background: rgba(255,56,96,0.05); }
  .log-item.selected { background: rgba(255,56,96,0.1); border-left: 2px solid var(--danger); }
  .log-item-id {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--danger);
  }
  .log-item-time {
    font-family: var(--font-mono);
    font-size: 0.55rem; color: var(--muted);
  }
  .log-item-preview {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--text);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .no-logs {
    padding: 30px 16px; text-align: center;
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
  }

  .admin-preview {
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .admin-preview-header {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,56,96,0.2);
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.2);
  }
  .preview-title {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--danger);
    letter-spacing: 2px; flex: 1;
  }
  .admin-preview-body {
    flex: 1; overflow-y: auto;
    padding: 20px;
  }
  .code-preview {
    font-family: var(--font-mono);
    font-size: 0.78rem; color: var(--accent);
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,255,170,0.1);
    border-radius: 4px;
    padding: 16px; white-space: pre-wrap;
    line-height: 1.7; min-height: 300px;
  }
  .meta-table {
    width: 100%; border-collapse: collapse;
    margin-bottom: 16px;
  }
  .meta-table td {
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,56,96,0.08);
    font-family: var(--font-mono);
    font-size: 0.65rem;
  }
  .meta-table td:first-child { color: var(--muted); width: 30%; }
  .meta-table td:last-child  { color: var(--text); }
  .no-selection {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
    letter-spacing: 3px;
  }

  /* ─── RIPPLE ─── */
  .ripple {
    position: absolute; border-radius: 50%;
    width: 60px; height: 60px;
    background: rgba(0,255,170,0.2);
    transform: translate(-50%, -50%) scale(0);
    animation: rippleAnim 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }

  /* ─── SCROLLBARS ─── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

  /* ─── SECTION DIVIDER ─── */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text {
    font-family: var(--font-mono);
    font-size: 0.55rem; color: var(--muted);
    letter-spacing: 3px;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div id="toast-container"></div>

<!-- ═══════════════ APP WRAPPER ═══════════════ -->
<div class="app-wrap">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="cpu-logo" id="cpu-logo" title="[CLASSIFIED]">
      <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="9" width="24" height="24" rx="2" stroke="#00ffaa" stroke-width="1.5"/>
        <rect x="14" y="14" width="14" height="14" rx="1" fill="rgba(0,255,170,0.08)" stroke="#00ffaa" stroke-width="1"/>
        <rect x="17" y="17" width="8" height="8" rx="1" fill="rgba(0,255,170,0.15)"/>
        <!-- pins left -->
        <line x1="1" y1="14" x2="9" y2="14" stroke="#00ffaa" stroke-width="1.2"/>
        <line x1="1" y1="19" x2="9" y2="19" stroke="#00ffaa" stroke-width="1.2"/>
        <line x1="1" y1="24" x2="9" y2="24" stroke="#00ffaa" stroke-width="1.2"/>
        <!-- pins right -->
